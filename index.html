<div id="boot" class="ov"><svg width="96" height="96"><use href="#i-orb"/></svg><h1>Aurora OS</h1><p id="msg">Collega il disco e scegli una cartella (non la radice del disco): dentro verrà creata la cartella WebOS. Oppure prova subito nel browser, senza installare nulla.</p><button id="go">Scegli disco (versione completa)</button><button id="tr">Prova nel browser (anche su telefono)</button><label><input type="checkbox" id="lg"> Modalità legacy (PC vecchi)</label></div>

<script>
const BI={};const VER='0.5.0',$=s=>document.querySelector(s),ic=(n,s=32)=>`<svg width="${s}" height="${s}"><use href="#i-${n}"/></svg>`,FI={cop:'cop',tic:'tic',txt:'txt',html:'html',csv:'tic',png:'img',jpg:'img'},fi=(n,k)=>k=='directory'?'folder':FI[(n.split('.').pop()||'').toLowerCase()]||'file',AI={notes:'cop',sheet:'tic',paint:'paint',calc:'calc',files:'folder',settings:'settings'};

let root,S={ver:VER,wp:0,bg:'#1f6fb5',glass:.5,blur:12,accent:'#4f8cff',icons:{},wins:[]},W=[],z=1,tick;

async function dir(p,mk){let d=root;for(const s of p.split('/').filter(Boolean))d=await d.getDirectoryHandle(s,{create:!!mk});return d}
async function ls(p){const d=await dir(p,1),o=[];for await(const[n,h]of d.entries())o.push({n,k:h.kind});return o.sort((a,b)=>(a.k>b.k)-(a.k<b.k)||a.n.localeCompare(b.n))}
async function rd(p){const[d,n]=sp(p);return(await(await dir(d)).getFileHandle(n)).getFile()}

const rm=async p=>{const[d,n]=sp(p);await(await dir(d)).removeEntry(n,{recursive:true})};

$('#go').onclick=async()=>{
 if(!window.TRIAL&&!window.showDirectoryPicker)return alert('Your browser can\'t write to drives. Use Chrome or Edge on a computer.');
 let h;try{h=window.TRIAL?await navigator.storage.getDirectory():await showDirectoryPicker({mode:'readwrite'})}catch(e){if(e.name!='AbortError')alert('The browser blocked this folder. Create a normal folder on the drive (for example "MyOS") and choose that one, not the drive root.');return}
 try{root=await h.getDirectoryHandle('WebOS',{create:true})}catch(e){return alert('Could not write to that folder: '+e.message)}
 for(const d of['Desktop','Documents','Pictures','Downloads','System'])await dir(d,1);
 let fresh=1;
 try{const o=JSON.parse(await(await rd('System/system.json')).text());fresh=0;S={...S,...o};
  if(cv(o.ver,VER)<0){if(confirm(`This drive has an older Aurora OS (v${o.ver}). Update to v${VER}? Your files and settings are kept.`))S.ver=VER;else S.ver=o.ver}

 for(const w of S.wins)launch(w.app,w.path,w);
 clearInterval(tick);tick=setInterval(save,18e4);await save();

 for(const r of W)try{await r.save()}catch(e){toast('Could not save: '+e.message)}
 try{S.wins=W.map(r=>({app:r.app,path:r.x.cur,x:r.w.offsetLeft,y:r.w.offsetTop,w:r.w.offsetWidth,h:r.w.offsetHeight,min:r.w.hidden}));
